openapi: 3.0.3
info:
  title: Want Keep collector ingestion contract
  version: "10"
  description: Internal read-only contract between the trusted Go application and a collector.
paths: {}
components:
  schemas:
    Provider:
      type: string
      enum: [alfa, raiffeisen, ozon, bybit, aifory, emcd]
    AssetCode:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,63}$"
    DecimalString:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
    DeploymentBinding:
      type: object
      additionalProperties: false
      required:
        - provider
        - environment
        - adapterBuildDigest
        - collectorImageDigest
        - contractVersion
        - allowlistRevision
        - nonSecretConfigRevision
        - operatorPermissionRevision
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        environment:
          type: string
          minLength: 1
          maxLength: 128
        adapterBuildDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        collectorImageDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        contractVersion:
          type: string
          enum: ["10"]
        allowlistRevision:
          type: string
          minLength: 1
          maxLength: 128
        nonSecretConfigRevision:
          type: string
          minLength: 1
          maxLength: 128
        operatorPermissionRevision:
          type: string
          minLength: 1
          maxLength: 128
    ReplayRange:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    SyncRequest:
      type: object
      additionalProperties: false
      required:
        - jobId
        - attempt
        - leaseToken
        - connectionId
        - connectionGeneration
        - binding
        - admissionRevision
      properties:
        jobId:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 100
        leaseToken:
          type: string
          minLength: 1
          maxLength: 2000
        connectionId:
          type: string
          format: uuid
        connectionGeneration:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        binding:
          $ref: "#/components/schemas/DeploymentBinding"
        admissionRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        cursor:
          type: string
          maxLength: 2000
        replayRange:
          $ref: "#/components/schemas/ReplayRange"
    ReadAction:
      type: string
      enum:
        [
          read_accounts,
          read_balances,
          read_transactions,
          read_history,
          read_rates,
        ]
    RecordKind:
      type: string
      enum: [account, balance_snapshot, transaction]
    Product:
      type: string
      enum:
        [
          current,
          debit_card,
          credit_card,
          savings,
          deposit,
          wallet,
          funding,
          spot,
          earn,
          coinhold,
          crypto_card,
          futures,
          mining,
        ]
    CapabilityLog:
      type: object
      additionalProperties: false
      required: [product, namespace, recordKinds]
      properties:
        product:
          $ref: "#/components/schemas/Product"
        namespace:
          type: string
          minLength: 1
          maxLength: 2000
        recordKinds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/RecordKind"
    HistoryCapability:
      type: object
      additionalProperties: false
      required: [paginated]
      properties:
        paginated:
          type: boolean
        maximumLookbackDays:
          type: integer
          minimum: 1
          maximum: 36500
    CapabilityManifest:
      type: object
      additionalProperties: false
      required: [provider, contractVersion, actions, products, logs, history]
      properties:
        provider:
          $ref: "#/components/schemas/Provider"
        contractVersion:
          type: string
          enum: ["10"]
        actions:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReadAction"
        products:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Product"
        logs:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/CapabilityLog"
        history:
          $ref: "#/components/schemas/HistoryCapability"
    Coverage:
      type: object
      additionalProperties: false
      required: [state, gaps]
      properties:
        state:
          type: string
          enum: [complete, partial, unavailable]
        gaps:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2000
    SourceAmount:
      type: object
      additionalProperties: false
      required: [state, assetCode]
      properties:
        state:
          type: string
          enum: [known, unknown, unavailable]
        assetCode:
          $ref: "#/components/schemas/AssetCode"
        amount:
          $ref: "#/components/schemas/DecimalString"
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    EvidenceBlob:
      type: object
      additionalProperties: false
      required: [id, mediaType, data, sha256, locator]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        mediaType:
          type: string
          enum: [application/json, application/xml, text/csv, text/html]
        data:
          type: string
          minLength: 1
          maxLength: 13981016
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        locator:
          type: string
          minLength: 1
          maxLength: 2000
    CardAlias:
      type: object
      additionalProperties: false
      required: [id, label, lastFour]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 2000
        label:
          type: string
          minLength: 1
          maxLength: 100
        lastFour:
          type: string
          pattern: "^[0-9]{4}$"
    AccountRecord:
      type: object
      additionalProperties: false
      required:
        [externalAccountId, product, assetCode, name, openingDate, evidenceId]
      properties:
        externalAccountId:
          type: string
          minLength: 1
          maxLength: 2000
        product:
          $ref: "#/components/schemas/Product"
        assetCode:
          $ref: "#/components/schemas/AssetCode"
        network:
          type: string
          maxLength: 2000
        name:
          type: string
          minLength: 1
          maxLength: 2000
        openingDate:
          type: string
          format: date
        aliases:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/CardAlias"
        evidenceId:
          type: string
          minLength: 1
          maxLength: 128
    BalanceSnapshotRecord:
      type: object
      additionalProperties: false
      required:
        [
          externalAccountId,
          product,
          assetCode,
          sourceAsOf,
          owned,
          available,
          locked,
          debt,
          creditLimit,
          ownAvailable,
          coverage,
          freshness,
          evidenceId,
        ]
      properties:
        externalAccountId:
          type: string
          minLength: 1
          maxLength: 2000
        product:
          $ref: "#/components/schemas/Product"
        assetCode:
          $ref: "#/components/schemas/AssetCode"
        network:
          type: string
          maxLength: 2000
        sourceAsOf:
          type: string
          format: date-time
        owned:
          $ref: "#/components/schemas/SourceAmount"
        available:
          $ref: "#/components/schemas/SourceAmount"
        locked:
          $ref: "#/components/schemas/SourceAmount"
        debt:
          $ref: "#/components/schemas/SourceAmount"
        creditLimit:
          $ref: "#/components/schemas/SourceAmount"
        ownAvailable:
          type: boolean
        coverage:
          $ref: "#/components/schemas/Coverage"
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        evidenceId:
          type: string
          minLength: 1
          maxLength: 128
    TransactionPosting:
      type: object
      additionalProperties: false
      required: [externalAccountId, product, assetCode, money, role]
      properties:
        externalAccountId:
          type: string
          minLength: 1
          maxLength: 2000
        product:
          $ref: "#/components/schemas/Product"
        network:
          type: string
          maxLength: 2000
        assetCode:
          $ref: "#/components/schemas/AssetCode"
        money:
          $ref: "#/components/schemas/DecimalString"
        role:
          type: string
          enum: [principal, fee, interest, funding, pnl, reward]
        funding:
          type: string
          enum: [own, credit, unknown]
        treatment:
          type: string
          enum: [movement, included, valuation]
        feeId:
          type: string
          maxLength: 2000
    TransactionRecord:
      type: object
      additionalProperties: false
      required:
        [
          externalAccountId,
          product,
          logNamespace,
          providerRecordId,
          classification,
          providerState,
          economicType,
          occurredAt,
          feeKnowledge,
          evidenceId,
          postings,
        ]
      properties:
        externalAccountId:
          type: string
          minLength: 1
          maxLength: 2000
        product:
          $ref: "#/components/schemas/Product"
        logNamespace:
          type: string
          minLength: 1
          maxLength: 2000
        providerRecordId:
          type: string
          minLength: 1
          maxLength: 2000
        classification:
          type: string
          enum: [new, correction, ambiguous]
        providerState:
          type: string
          enum: [unknown, draft, pending, posted, cancelled, reversed]
        economicType:
          type: string
          enum:
            [income, expense, transfer, exchange, refund, yield, trade_result]
        occurredAt:
          type: string
          format: date-time
        postedAt:
          type: string
          format: date-time
        merchant:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000
        feeKnowledge:
          type: string
          enum: [known, unknown]
        pnlBasis:
          type: string
          enum: [gross, net]
        evidenceId:
          type: string
          minLength: 1
          maxLength: 128
        postings:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/TransactionPosting"
    IngestionRecord:
      type: object
      additionalProperties: false
      required: [recordType]
      properties:
        recordType:
          $ref: "#/components/schemas/RecordKind"
        account:
          $ref: "#/components/schemas/AccountRecord"
        balanceSnapshot:
          $ref: "#/components/schemas/BalanceSnapshotRecord"
        transaction:
          $ref: "#/components/schemas/TransactionRecord"
    SyncPage:
      type: object
      additionalProperties: false
      description: Every supported account referenced by a balance or posting has exactly one account descriptor in the same self-contained page. Descriptors may repeat on later pages without creating duplicate accounts or openings.
      required:
        [
          jobId,
          attempt,
          leaseToken,
          connectionGeneration,
          binding,
          admissionRevision,
          cursor,
          complete,
          coverage,
          evidence,
          records,
        ]
      properties:
        jobId:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 100
        leaseToken:
          type: string
          minLength: 1
          maxLength: 2000
        connectionGeneration:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        binding:
          $ref: "#/components/schemas/DeploymentBinding"
        admissionRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        cursor:
          type: string
          maxLength: 2000
        nextCursor:
          type: string
          maxLength: 2000
        complete:
          type: boolean
        coverage:
          $ref: "#/components/schemas/Coverage"
        evidence:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/EvidenceBlob"
        records:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IngestionRecord"
    ProviderFailure:
      type: object
      additionalProperties: false
      required:
        [
          jobId,
          attempt,
          leaseToken,
          connectionGeneration,
          binding,
          admissionRevision,
          kind,
          retryable,
          evidence,
        ]
      properties:
        jobId:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
          maximum: 100
        leaseToken:
          type: string
          minLength: 1
          maxLength: 2000
        connectionGeneration:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        binding:
          $ref: "#/components/schemas/DeploymentBinding"
        admissionRevision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        kind:
          type: string
          enum:
            [
              reauthentication_required,
              mfa_required,
              captcha_required,
              rate_limited,
              temporary_failure,
              permanent_failure,
              unsupported_capability,
              contract_violation,
            ]
        retryable:
          type: boolean
        retryAfterSeconds:
          type: integer
          minimum: 1
          maximum: 86400
        safeMessage:
          type: string
          maxLength: 2000
        evidence:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/EvidenceBlob"
    SyncResult:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [page, failure]
        page:
          $ref: "#/components/schemas/SyncPage"
        failure:
          $ref: "#/components/schemas/ProviderFailure"
