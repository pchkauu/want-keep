server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name want-keep.tech;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_max_body_size 16k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/want-keep-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 308 https://want-keep.tech$uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name want-keep.tech;
    ssl_certificate /etc/letsencrypt/live/want-keep.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/want-keep.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;

    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location = /_health {
        return 204;
    }

    location = /api/v1/connections/raiffeisen/callback {
        default_type text/plain;
        return 503 "Raiffeisen authorization is not enabled. No authorization code was processed.\n";
    }

    location / {
        default_type text/plain;
        return 404 "Want Keep application is not deployed.\n";
    }
}
