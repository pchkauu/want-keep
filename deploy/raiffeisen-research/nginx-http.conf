server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name want-keep.tech;
    access_log off;
    error_log /dev/null;
    server_tokens off;
    client_max_body_size 16k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/want-keep-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        default_type text/plain;
        return 503 "Want Keep HTTPS setup is in progress.\n";
    }
}
