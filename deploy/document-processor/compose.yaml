services:
  document-processor:
    build:
      context: ../..
      dockerfile: deploy/document-processor/Dockerfile
      target: runtime
    network_mode: none
    read_only: true
    user: '10000:10000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=134217728,mode=1777
    volumes:
      - processor-socket:/run/want-keep
    restart: unless-stopped
volumes:
  processor-socket:
