name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: backend/go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: make e2e SCENARIO=access
  design-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm exec --prefix web -- playwright install --with-deps chromium
      - run: make e2e SCENARIO=design-tokens
      - run: make e2e SCENARIO=design-components
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WANT_KEEP_ENV: test
    services:
      postgres:
        image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: want_keep_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d want_keep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: backend/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            collector/package-lock.json

      - name: Install dependencies
        run: make bootstrap

      - name: Verify repository
        run: make check

      - name: Verify durable jobs, scheduling and process recovery
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=jobs
          make test-jobs-race

      - name: Verify collector ingestion contract and concurrent delivery
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-collector FILTER=contracts
          make test-integration AREA=ingestion
          make test-ingestion-race

      - name: Verify OpenAI budget, recovery and concurrent reservations
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=ai-budget
          make test-ai-budget-race

      - name: Verify PostgreSQL storage and transaction races
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=storage
          make test-storage-race

      - name: Verify identity transactions and access recovery
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=identity
          make test-identity-race

      - name: Verify transfer matching and concurrent decisions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=matching
          make test-matching-race

      - name: Verify corrections, selective undo and audit transactions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=audit
          make test-audit-race

      - name: Verify categories, merchants and receipt item classification
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=categories
          make test-categories-race

      - name: Verify family allocations and concurrent rule decisions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=family-allocation
          make test-family-allocation-race

      - name: Verify refunds, historical allocations and concurrent caps
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=refunds
          make test-refunds-race

      - name: Verify balance reconciliation and concurrent resolutions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=reconciliation
          make test-reconciliation-race

      - name: Verify ledger states, native effects and concurrent commands
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=ledger
          make test-ledger-race

      - name: Verify accounts, opening balances and concurrent commands
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=accounts
          make test-accounts-race

      - name: Verify household invitations and resource permissions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=household
          make test-household-race

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify private storage, HTTP and isolated document processor with race detection
        run: make test-integration AREA=privacy
