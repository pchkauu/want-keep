name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WANT_KEEP_ENV: test
    services:
      postgres:
        image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_DB: want_keep_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d want_keep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: backend/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
            collector/package-lock.json

      - name: Install dependencies
        run: make bootstrap

      - name: Verify repository
        run: make check

      - name: Verify PostgreSQL storage and transaction races
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=storage
          make test-storage-race

      - name: Verify identity transactions and access recovery
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=identity
          make test-identity-race

      - name: Verify corrections, selective undo and audit transactions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=audit
          make test-audit-race

      - name: Verify ledger states, native effects and concurrent commands
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=ledger
          make test-ledger-race

      - name: Verify accounts, opening balances and concurrent commands
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=accounts
          make test-accounts-race

      - name: Verify household invitations and resource permissions
        env:
          WANT_KEEP_TEST_DATABASE_URL: postgres://postgres:synthetic-admin@127.0.0.1:5432/want_keep_test?sslmode=disable
        run: |
          make test-integration AREA=household
          make test-household-race

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify private storage, HTTP and isolated document processor with race detection
        run: make test-integration AREA=privacy
