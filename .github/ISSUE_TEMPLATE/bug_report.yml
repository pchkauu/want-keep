name: Bug report
description: Report unexpected behavior in Want Keep
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Remove all secrets and personal financial information before attaching logs or screenshots.**

        Do not include API keys, bank credentials, access tokens, cookies, account numbers, or real transaction data.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: How can someone reproduce this without real credentials or live financial data?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser or app version, language/runtime versions, and any other relevant environment details.
      placeholder: |
        OS:
        App / browser:
        Version:
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Not applicable yet
        - Local development
        - Self-hosted
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs after removing secrets and personal financial information.
      render: text
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that would help, without real financial data.
