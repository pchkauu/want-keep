name: Integration request
description: Propose a bank, exchange, wallet, or fintech connector
labels: ["integration"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a new bank, exchange, wallet, or fintech service.

        Do not attach credentials, cookies, or live account data.
        Unofficial or private APIs need a clear, lawful basis before any implementation work.
  - type: input
    id: service_name
    attributes:
      label: Service name
      placeholder: Alfa Bank, Bybit, ...
    validations:
      required: true
  - type: dropdown
    id: service_type
    attributes:
      label: Service type
      options:
        - Bank
        - Exchange
        - Wallet
        - Fintech
        - Other
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
      description: Primary country or region of the service.
    validations:
      required: true
  - type: textarea
    id: api_docs
    attributes:
      label: API documentation
      description: Links to official API docs, developer portals, or public integration programs.
    validations:
      required: true
  - type: dropdown
    id: auth_type
    attributes:
      label: Authentication type
      options:
        - OAuth
        - API key
        - Username and password
        - Session / cookie
        - Unknown
        - Other
    validations:
      required: true
  - type: textarea
    id: transaction_api
    attributes:
      label: Available transaction API
      description: Can the service provide transaction history? Note pagination and filters if known.
    validations:
      required: true
  - type: textarea
    id: balance_api
    attributes:
      label: Available balance API
      description: Can the service provide current balances and account lists?
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: Webhooks / polling
      options:
        - Webhooks
        - Polling
        - Both
        - Unknown
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Rate limits, supported currencies, legal constraints, or other details. No secrets.
