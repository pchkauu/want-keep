---
ResourceReference:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      minLength: 1
      maxLength: 2000
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
  required:
  - type
  - id
CalculationInput:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 2000
    amount:
      "$ref": "./quality.yaml#/AmountValue"
    resources:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
  required:
  - name
  - amount
  - resources
ExplainableAmount:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 2000
    kind:
      type: string
      enum:
      - actual
      - forecast
      - reserved
      - revaluation
    native:
      type: array
      items:
        "$ref": "./money.yaml#/Money"
    reporting:
      "$ref": "./quality.yaml#/AmountValue"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    method:
      type: string
      minLength: 1
      maxLength: 2000
    inputs:
      type: array
      items:
        "$ref": "./reports.yaml#/CalculationInput"
    resources:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
  required:
  - name
  - kind
  - native
  - reporting
  - quality
  - method
  - inputs
  - resources
ReportContext:
  type: object
  additionalProperties: false
  properties:
    view:
      type: string
      enum:
      - household
      - member
    memberId:
      "$ref": "./money.yaml#/ID"
    reportingAsset:
      "$ref": "./money.yaml#/Asset"
    from:
      "$ref": "./money.yaml#/Date"
    to:
      "$ref": "./money.yaml#/Date"
    timezone:
      "$ref": "./money.yaml#/Timezone"
  required:
  - view
  - reportingAsset
  - from
  - to
  - timezone
  description: Member view requires memberId belonging to the current family. A display
    filter never changes principal.
Report:
  type: object
  additionalProperties: false
  properties:
    context:
      "$ref": "./reports.yaml#/ReportContext"
    amounts:
      type: array
      items:
        "$ref": "./reports.yaml#/ExplainableAmount"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - context
  - amounts
  - quality
UpcomingPayment:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    label:
      type: string
      minLength: 1
      maxLength: 2000
    dueDate:
      "$ref": "./money.yaml#/Date"
    outstanding:
      "$ref": "./quality.yaml#/AmountValue"
    risk:
      type: string
      enum:
      - covered
      - shortfall
      - unknown
  required:
  - id
  - label
  - dueDate
  - outstanding
  - risk
Dashboard:
  type: object
  additionalProperties: false
  properties:
    context:
      "$ref": "./reports.yaml#/ReportContext"
    dailyLimits:
      type: array
      items:
        "$ref": "./reports.yaml#/ExplainableAmount"
    upcomingPayments:
      type: array
      items:
        "$ref": "./reports.yaml#/UpcomingPayment"
    planActual:
      type: array
      items:
        "$ref": "./reports.yaml#/ExplainableAmount"
    goals:
      type: array
      items:
        "$ref": "./goals.yaml#/Goal"
    attention:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - context
  - dailyLimits
  - upcomingPayments
  - planActual
  - goals
  - attention
  - quality
ValuationObservation:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    rate:
      "$ref": "./money.yaml#/Rate"
    requestedDate:
      "$ref": "./money.yaml#/Date"
    observedAt:
      "$ref": "./money.yaml#/Instant"
    fetchedAt:
      "$ref": "./money.yaml#/Instant"
    source:
      type: string
      minLength: 1
      maxLength: 2000
    method:
      type: string
      enum:
      - reference
      - executed
    granularity:
      type: string
      enum:
      - instant
      - daily
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - id
  - revision
  - rate
  - requestedDate
  - observedAt
  - fetchedAt
  - source
  - method
  - granularity
  - quality
Insight:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    summary:
      type: string
      minLength: 1
      maxLength: 2000
    evidence:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
      minItems: 1
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    proposalId:
      "$ref": "./money.yaml#/ID"
  required:
  - id
  - revision
  - summary
  - evidence
  - quality
ValuationObservationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./reports.yaml#/ValuationObservation"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
InsightPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./reports.yaml#/Insight"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
KnownReturn:
  type: object
  additionalProperties: false
  properties:
    state:
      type: string
      enum:
      - known
    ratio:
      "$ref": "./money.yaml#/Decimal"
  required:
  - state
  - ratio
  description: 'Dimensionless annualized XIRR ratio as an exact decimal string: 0.12
    means 12%, -0.05 means -5%. A unique validated root greater than -1 is required;
    do not substitute provider APR.'
UnavailableReturn:
  type: object
  additionalProperties: false
  properties:
    state:
      type: string
      enum:
      - unavailable
    reason:
      type: string
      enum:
      - no_sign_change
      - zero_period
      - missing_valuation
      - partial_history
      - no_unique_root
      - solver_failure
  required:
  - state
  - reason
ReturnValue:
  oneOf:
  - "$ref": "./reports.yaml#/KnownReturn"
  - "$ref": "./reports.yaml#/UnavailableReturn"
ReturnCashFlow:
  type: object
  additionalProperties: false
  properties:
    date:
      "$ref": "./money.yaml#/Date"
    amount:
      "$ref": "./money.yaml#/Money"
    kind:
      type: string
      enum:
      - contribution
      - distribution
      - terminal_value
    resources:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
  required:
  - date
  - amount
  - kind
  - resources
  description: 'Signed cash flows in the metric asset: contributions negative, distributions/terminal
    value positive. Source links retain provenance; historical FX applies to each
    dated flow.'
ReturnMetric:
  type: object
  additionalProperties: false
  properties:
    basis:
      type: string
      enum:
      - native
      - reporting
    asset:
      "$ref": "./money.yaml#/Asset"
    kind:
      type: string
      enum:
      - actual
      - forecast
    method:
      type: string
      enum:
      - xirr
    value:
      "$ref": "./reports.yaml#/ReturnValue"
    flows:
      type: array
      items:
        "$ref": "./reports.yaml#/ReturnCashFlow"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - basis
  - asset
  - kind
  - method
  - value
  - flows
  - quality
  description: Native and reporting results are separate observations, even when the
    requested reporting asset matches the native asset. The application validates
    cash-flow asset/signs, dates, method and availability. Solver remains task-0.10/task-6.4.
ReturnsReport:
  type: object
  additionalProperties: false
  properties:
    context:
      "$ref": "./reports.yaml#/ReportContext"
    amounts:
      type: array
      items:
        "$ref": "./reports.yaml#/ExplainableAmount"
    returns:
      type: array
      items:
        "$ref": "./reports.yaml#/ReturnMetric"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - context
  - amounts
  - returns
  - quality
