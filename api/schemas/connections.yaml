---
Connection:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    provider:
      "$ref": "./money.yaml#/Provider"
    externalAccountOwnerId:
      "$ref": "./money.yaml#/ID"
    historyFrom:
      "$ref": "./money.yaml#/Date"
    products:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 2000
    state:
      type: string
      enum:
      - pending
      - connected
      - syncing
      - reauth_required
      - disconnected
      - failed
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    deploymentGate:
      "$ref": "./connections.yaml#/DeploymentGate"
    generation:
      "$ref": "./money.yaml#/Revision"
    lastError:
      "$ref": "./quality.yaml#/APIError"
  required:
  - id
  - revision
  - provider
  - externalAccountOwnerId
  - historyFrom
  - products
  - state
  - quality
  - generation
  - deploymentGate
ConnectionCreate:
  type: object
  additionalProperties: false
  properties:
    provider:
      "$ref": "./money.yaml#/Provider"
    externalAccountOwnerId:
      "$ref": "./money.yaml#/ID"
    historyFrom:
      "$ref": "./money.yaml#/Date"
    products:
      type: array
      items:
        type: string
        minLength: 1
        maxLength: 2000
      minItems: 1
  required:
  - provider
  - externalAccountOwnerId
  - historyFrom
  - products
ConnectionAction:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
  required:
  - expectedRevision
AuthorizationAttempt:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    connectionId:
      "$ref": "./money.yaml#/ID"
    expiresAt:
      "$ref": "./money.yaml#/Instant"
    state:
      type: string
      enum:
      - awaiting_owner
      - ready
      - completed
      - failed
    authorizationUrl:
      type: string
      format: uri
  required:
  - id
  - connectionId
  - expiresAt
  - state
  description: URL is returned only to the authenticated external-account owner; no
    credentials in shared chat or general connection responses.
ConnectionPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./connections.yaml#/Connection"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality

DeploymentBinding:
  type: object
  additionalProperties: false
  properties:
    provider:
      $ref: ./money.yaml#/Provider
    environment:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    adapterBuildDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    collectorImageDigest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    contractVersion:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    allowlistRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    nonSecretConfigRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
    operatorPermissionRevision:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$
  required:
    - provider
    - environment
    - adapterBuildDigest
    - collectorImageDigest
    - contractVersion
    - allowlistRevision
    - nonSecretConfigRevision
    - operatorPermissionRevision
PendingDeploymentGate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - pending
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 2
      uniqueItems: true
      minItems: 1
  required:
    - status
    - reasons
AdmittedDeploymentGate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - admitted
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 0
      uniqueItems: true
  required:
    - status
    - binding
    - checkedAt
    - reasons
BlockedDeploymentGate:
  type: object
  additionalProperties: false
  properties:
    status:
      type: string
      enum:
        - blocked
    binding:
      $ref: ./connections.yaml#/DeploymentBinding
    checkedAt:
      $ref: ./money.yaml#/Instant
    reasons:
      type: array
      items:
        type: string
        enum:
          - provider_pending
          - host_pending
          - provider_failed
          - host_failed
          - provider_revoked
          - host_revoked
      maxItems: 2
      uniqueItems: true
      minItems: 1
  required:
    - status
    - binding
    - checkedAt
    - reasons
DeploymentGate:
  oneOf:
    - $ref: ./connections.yaml#/PendingDeploymentGate
    - $ref: ./connections.yaml#/AdmittedDeploymentGate
    - $ref: ./connections.yaml#/BlockedDeploymentGate
  description: >-
    Server-owned D-43 admission, separate from authentication. Only the admission service combines
    provider and host evidence for the exact binding. A missing or changed binding denies sync
    before job creation; clients and AI cannot set admission.
