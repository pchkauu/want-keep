Reimbursement:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    decisionId:
      "$ref": "./money.yaml#/ID"
    state:
      type: string
      enum:
      - open
      - settled
      - attention_required
      - voided
    creditorMemberId:
      "$ref": "./money.yaml#/ID"
    debtorMemberId:
      "$ref": "./money.yaml#/ID"
    principal:
      "$ref": "./money.yaml#/Money"
    outstanding:
      "$ref": "./money.yaml#/Money"
    expenseId:
      "$ref": "./money.yaml#/ID"
    expenseRevision:
      "$ref": "./money.yaml#/Revision"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    attentionReason:
      type: string
      minLength: 1
      maxLength: 2000
    actorId:
      "$ref": "./money.yaml#/ID"
    recordedAt:
      "$ref": "./money.yaml#/Instant"
    settlements:
      type: array
      maxItems: 1000
      items:
        "$ref": "./reimbursements.yaml#/ReimbursementSettlement"
  required:
  - id
  - revision
  - decisionId
  - state
  - creditorMemberId
  - debtorMemberId
  - principal
  - outstanding
  - reason
  - actorId
  - recordedAt
  - settlements
  description: Explicit inter-member claim. It is excluded from household assets,
    balances, income and expenses.
ReimbursementSettlement:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    state:
      type: string
      enum:
      - active
      - stale
      - undone
    transferId:
      "$ref": "./money.yaml#/ID"
    transferRevision:
      "$ref": "./money.yaml#/Revision"
    transferAmount:
      "$ref": "./money.yaml#/PositiveMoney"
    settledAmount:
      "$ref": "./money.yaml#/PositiveMoney"
    operationIds:
      type: array
      minItems: 1
      maxItems: 100
      uniqueItems: true
      items:
        "$ref": "./money.yaml#/ID"
    actorId:
      "$ref": "./money.yaml#/ID"
    recordedAt:
      "$ref": "./money.yaml#/Instant"
  required:
  - id
  - state
  - transferId
  - transferRevision
  - transferAmount
  - settledAmount
  - operationIds
  - actorId
  - recordedAt
ReimbursementCreate:
  type: object
  additionalProperties: false
  properties:
    creditorMemberId:
      "$ref": "./money.yaml#/ID"
    debtorMemberId:
      "$ref": "./money.yaml#/ID"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
    expenseId:
      "$ref": "./money.yaml#/ID"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - creditorMemberId
  - debtorMemberId
  - amount
  - reason
SettlementCreate:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    transferId:
      "$ref": "./money.yaml#/ID"
    transferExpectedRevision:
      "$ref": "./money.yaml#/Revision"
    transferAmount:
      "$ref": "./money.yaml#/PositiveMoney"
    settledAmount:
      "$ref": "./money.yaml#/PositiveMoney"
  required:
  - expectedRevision
  - transferId
  - transferExpectedRevision
  - transferAmount
  - settledAmount
  description: Both amounts explicit for cross-asset settlement. Cannot exceed outstanding
    debt or unused transfer amount.
ReimbursementCorrection:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    creditorMemberId:
      "$ref": "./money.yaml#/ID"
    debtorMemberId:
      "$ref": "./money.yaml#/ID"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
    expenseId:
      "$ref": "./money.yaml#/ID"
    clearExpense:
      type: boolean
      default: false
    debtReason:
      type: string
      minLength: 1
      maxLength: 2000
    voided:
      type: boolean
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - expectedRevision
  - reason
  description: Omitted fields remain unchanged. expenseId and clearExpense are mutually
    exclusive. Changes that overlap active settlements are rejected.
ReimbursementUndo:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    decisionId:
      "$ref": "./money.yaml#/ID"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - expectedRevision
  - decisionId
  - reason
ReimbursementPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./reimbursements.yaml#/Reimbursement"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
