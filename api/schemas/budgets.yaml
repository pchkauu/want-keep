---
BudgetLine:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    ownership:
      "$ref": "./household.yaml#/Ownership"
    kind:
      type: string
      enum:
      - obligation
      - flexible
      - expected_income
    planned:
      "$ref": "./money.yaml#/Money"
    actual:
      "$ref": "./money.yaml#/Money"
    categoryId:
      "$ref": "./money.yaml#/ID"
    dueDate:
      "$ref": "./money.yaml#/Date"
    allocation:
      "$ref": "./transactions.yaml#/ExpenseAllocation"
    status:
      type: string
      enum:
      - draft
      - approved
  required:
  - id
  - revision
  - ownership
  - kind
  - planned
  - actual
  - allocation
  - status
BudgetLineInput:
  type: object
  additionalProperties: false
  properties:
    ownership:
      "$ref": "./household.yaml#/ScopeInput"
    kind:
      type: string
      enum:
      - obligation
      - flexible
      - expected_income
    planned:
      "$ref": "./money.yaml#/PositiveMoney"
    categoryId:
      "$ref": "./money.yaml#/ID"
    dueDate:
      "$ref": "./money.yaml#/Date"
    allocation:
      "$ref": "./transactions.yaml#/ExpenseAllocation"
  required:
  - ownership
  - kind
  - planned
  - allocation
Budget:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    householdId:
      "$ref": "./money.yaml#/ID"
    month:
      "$ref": "./money.yaml#/Month"
    timezone:
      "$ref": "./money.yaml#/Timezone"
    lines:
      type: array
      items:
        "$ref": "./budgets.yaml#/BudgetLine"
  required:
  - id
  - revision
  - householdId
  - month
  - timezone
  - lines
BudgetCreate:
  type: object
  additionalProperties: false
  properties:
    month:
      "$ref": "./money.yaml#/Month"
    timezone:
      "$ref": "./money.yaml#/Timezone"
    copyFromBudgetId:
      "$ref": "./money.yaml#/ID"
  required:
  - month
  - timezone
  description: Creates a new month; copying does not roll balances or approvals forward.
BudgetLineChange:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    line:
      "$ref": "./budgets.yaml#/BudgetLineInput"
  required:
  - expectedRevision
  - line
BudgetApproval:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    lineIds:
      type: array
      items:
        "$ref": "./money.yaml#/ID"
      minItems: 1
  required:
  - expectedRevision
  - lineIds
  description: Only authorized lines are approved. A shared plan never approves the
    partner personal drafts implicitly.
BudgetPreview:
  type: object
  additionalProperties: false
  properties:
    budgetId:
      "$ref": "./money.yaml#/ID"
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    line:
      "$ref": "./budgets.yaml#/BudgetLineInput"
  required:
  - budgetId
  - expectedRevision
  - line
BudgetPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./budgets.yaml#/Budget"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
