---
SourceReference:
  type: object
  additionalProperties: false
  properties:
    provider:
      "$ref": "./money.yaml#/Provider"
    externalAccountId:
      type: string
      minLength: 1
      maxLength: 2000
    product:
      type: string
      minLength: 1
      maxLength: 2000
    log:
      type: string
      minLength: 1
      maxLength: 2000
    sourceId:
      type: string
      minLength: 1
      maxLength: 2000
    revision:
      type: string
      minLength: 1
      maxLength: 2000
    connectionId:
      "$ref": "./money.yaml#/ID"
    externalAssetCode:
      type: string
      minLength: 1
      maxLength: 2000
    network:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - provider
  - externalAccountId
  - product
  - log
  - sourceId
  - revision
  - connectionId
  description: Source identity is household-scoped and stable across connection recreation.
    External identifiers, raw asset codes and networks are separate from normalized
    Money.Asset; unknown aliases are never mapped by resemblance.
Balance:
  type: object
  additionalProperties: false
  properties:
    owned:
      "$ref": "./quality.yaml#/AmountValue"
    available:
      "$ref": "./quality.yaml#/AmountValue"
    locked:
      "$ref": "./quality.yaml#/AmountValue"
    debt:
      "$ref": "./quality.yaml#/AmountValue"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - owned
  - available
  - locked
  - debt
  - quality
Account:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    name:
      type: string
      minLength: 1
      maxLength: 2000
    ownership:
      "$ref": "./household.yaml#/Ownership"
    asset:
      "$ref": "./money.yaml#/Asset"
    product:
      type: string
      enum:
      - cash
      - current
      - debit_card
      - credit_card
      - savings
      - deposit
      - wallet
      - funding
      - spot
      - futures
      - mining
      - earn
      - coinhold
      - crypto_card
    opening:
      $ref: './accounts.yaml#/OpeningPoint'
    cardAliases:
      type: array
      items:
        $ref: './accounts.yaml#/CardAlias'
    sourceBalance:
      $ref: './accounts.yaml#/SourceBalance'
    fundingAvailability:
      $ref: './quality.yaml#/AmountValue'
    network:
      type: string
      maxLength: 2000
    externalAssetCode:
      type: string
      maxLength: 2000
    balance:
      "$ref": "./accounts.yaml#/Balance"
    openingDate:
      "$ref": "./money.yaml#/Date"
    connectionId:
      "$ref": "./money.yaml#/ID"
    externalAccountOwnerId:
      "$ref": "./money.yaml#/ID"
  required:
  - id
  - revision
  - name
  - ownership
  - asset
  - product
  - balance
  - openingDate
  - cardAliases
  - fundingAvailability
AccountCreate:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 2000
    ownership:
      "$ref": "./household.yaml#/ScopeInput"
    asset:
      "$ref": "./money.yaml#/Asset"
    product:
      type: string
      enum:
      - cash
    openingDate:
      "$ref": "./money.yaml#/Date"
    openingBalance:
      "$ref": "./money.yaml#/Money"
  required:
  - name
  - ownership
  - asset
  - product
  - openingDate
  - openingBalance
  description: Manual cash account. Opening money must match account asset and is
    not income. Imported products are created only by verified adapters.
AccountOwnershipChange:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    ownership:
      "$ref": "./household.yaml#/ScopeInput"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - expectedRevision
  - ownership
  - reason
OpeningCorrection:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    date:
      "$ref": "./money.yaml#/Date"
    balances:
      "$ref": "./accounts.yaml#/OpeningAmounts"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - expectedRevision
  - date
  - balances
  - reason
Reconciliation:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    accountId:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    ledger:
      "$ref": "./quality.yaml#/AmountValue"
    source:
      "$ref": "./quality.yaml#/AmountValue"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    relatedTransactionIds:
      type: array
      items:
        "$ref": "./money.yaml#/ID"
    state:
      type: string
      enum:
      - open
      - resolved
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - id
  - accountId
  - revision
  - ledger
  - source
  - quality
  - relatedTransactionIds
  - state
  - reason
AccountPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./accounts.yaml#/Account"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
ReconciliationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./accounts.yaml#/Reconciliation"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
OpeningAmounts:
  type: object
  additionalProperties: false
  properties:
    owned:
      $ref: './quality.yaml#/AmountValue'
    available:
      $ref: './quality.yaml#/AmountValue'
    locked:
      $ref: './quality.yaml#/AmountValue'
    debt:
      $ref: './quality.yaml#/AmountValue'
  required: [owned, available, locked, debt]
OpeningPoint:
  type: object
  additionalProperties: false
  properties:
    revision:
      $ref: './money.yaml#/Revision'
    date:
      $ref: './money.yaml#/Date'
    timezone:
      $ref: './money.yaml#/Timezone'
    confirmed:
      type: boolean
    balances:
      $ref: './accounts.yaml#/OpeningAmounts'
    actorId:
      $ref: './money.yaml#/ID'
    reason:
      type: string
      minLength: 1
      maxLength: 2000
    recordedAt:
      $ref: './money.yaml#/Instant'
  required: [revision, date, timezone, confirmed, balances, actorId, reason, recordedAt]
CardAlias:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: './money.yaml#/ID'
    label:
      type: string
      minLength: 1
      maxLength: 100
    lastFour:
      type: string
      pattern: '^[0-9]{4}$'
  required: [id, label, lastFour]
SourceBalance:
  type: object
  additionalProperties: false
  properties:
    id:
      $ref: './money.yaml#/ID'
    connectionId:
      $ref: './money.yaml#/ID'
    balances:
      $ref: './accounts.yaml#/Balance'
    creditLimit:
      $ref: './quality.yaml#/AmountValue'
    ownAvailabilityVerified:
      type: boolean
    evidenceRef:
      type: string
      minLength: 1
      maxLength: 2000
  required: [id, connectionId, balances, creditLimit, ownAvailabilityVerified, evidenceRef]
