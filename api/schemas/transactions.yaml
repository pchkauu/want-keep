---
MemberAmount:
  type: object
  additionalProperties: false
  properties:
    memberId:
      "$ref": "./money.yaml#/ID"
    amount:
      "$ref": "./money.yaml#/Money"
  required:
  - memberId
  - amount
MemberShare:
  type: object
  additionalProperties: false
  properties:
    memberId:
      "$ref": "./money.yaml#/ID"
    share:
      "$ref": "./money.yaml#/PositiveDecimal"
  required:
  - memberId
  - share
AmountAllocation:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum:
      - amounts
    purpose:
      type: string
      enum:
      - personal
      - shared
    members:
      type: array
      items:
        "$ref": "./transactions.yaml#/MemberAmount"
      minItems: 1
      maxItems: 1000
  required:
  - mode
  - purpose
  - members
ShareAllocation:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum:
      - shares
    purpose:
      type: string
      enum:
      - personal
      - shared
    members:
      type: array
      items:
        "$ref": "./transactions.yaml#/MemberShare"
      minItems: 1
      maxItems: 1000
  required:
  - mode
  - purpose
  - members
  description: Shares must sum to exactly 100. Allocation uses largest remainders
    and memberId ties.
EqualAllocation:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum: [equal]
    purpose:
      type: string
      enum: [personal, shared]
    memberId:
      "$ref": "./money.yaml#/ID"
  required: [mode, purpose]
  description: Shared equal allocation uses every active household membership. Personal equal allocation requires memberId.
UnresolvedAllocation:
  type: object
  additionalProperties: false
  properties:
    mode:
      type: string
      enum:
      - unresolved
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - mode
  - reason
ExpenseAllocation:
  oneOf:
  - "$ref": "./transactions.yaml#/AmountAllocation"
  - "$ref": "./transactions.yaml#/ShareAllocation"
  - "$ref": "./transactions.yaml#/EqualAllocation"
  - "$ref": "./transactions.yaml#/UnresolvedAllocation"
AllocationRuleReference:
  type: object
  additionalProperties: false
  properties:
    ruleId: { $ref: './money.yaml#/ID' }
    revision: { $ref: './money.yaml#/Revision' }
  required: [ruleId, revision]
AllocationSnapshot:
  type: object
  additionalProperties: false
  properties:
    state: { type: string, enum: [resolved, partial, unresolved, not_applicable] }
    purpose: { type: string, enum: [personal, shared] }
    mode: { type: string, enum: [amounts, shares, equal, unresolved, composite] }
    origin: { type: string, enum: [explicit_purchase, explicit_item, rule, equal_default, unresolved, mixed, not_applicable] }
    reason: { type: string, maxLength: 2000 }
    members:
      type: array
      maxItems: 6000
      items: { $ref: './transactions.yaml#/MemberAmount' }
    unallocated:
      type: array
      maxItems: 6
      items: { $ref: './money.yaml#/Money' }
    rules:
      type: array
      maxItems: 1000
      items: { $ref: './transactions.yaml#/AllocationRuleReference' }
  required: [state, origin, reason, members, unallocated, rules]
  description: Immutable analytical allocation. Member amounts may repeat for different assets; assets are never converted or added together.
Posting:
  type: object
  additionalProperties: false
  properties:
    accountId:
      "$ref": "./money.yaml#/ID"
    money:
      "$ref": "./money.yaml#/Money"
    funding:
      "$ref": "./transactions.yaml#/PostingFunding"
    treatment:
      "$ref": "./transactions.yaml#/PostingTreatment"
    role:
      type: string
      enum:
      - principal
      - fee
      - interest
      - funding
      - pnl
      - reward
  required:
  - accountId
  - money
  - role
ReceiptItem:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    name:
      type: string
      minLength: 1
      maxLength: 2000
    quantity:
      "$ref": "./money.yaml#/PositiveDecimal"
    gross:
      "$ref": "./money.yaml#/Money"
    discount:
      "$ref": "./money.yaml#/Money"
    net:
      "$ref": "./money.yaml#/Money"
    categoryId:
      "$ref": "./money.yaml#/ID"
    allocation:
      "$ref": "./transactions.yaml#/AllocationSnapshot"
  required:
  - id
  - name
  - quantity
  - gross
  - discount
  - net
  - allocation
ReceiptItemInput:
  type: object
  additionalProperties: false
  properties:
    id: { $ref: './money.yaml#/ID' }
    name: { type: string, minLength: 1, maxLength: 2000 }
    quantity: { $ref: './money.yaml#/PositiveDecimal' }
    gross: { $ref: './money.yaml#/PositiveMoney' }
    discount: { $ref: './money.yaml#/Money' }
    categoryId: { $ref: './money.yaml#/ID' }
  required: [id, name, quantity, gross]
ClassificationProposalItem:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    name:
      type: string
      minLength: 1
      maxLength: 2000
    quantity:
      "$ref": "./money.yaml#/PositiveDecimal"
    gross:
      "$ref": "./money.yaml#/Money"
    discount:
      "$ref": "./money.yaml#/Money"
    net:
      "$ref": "./money.yaml#/Money"
    categoryId:
      "$ref": "./money.yaml#/ID"
  required: [id, name, quantity, gross, discount, net]
ClassificationReferenceChange:
  type: object
  additionalProperties: false
  properties:
    action: { type: string, enum: [set, clear] }
    id: { $ref: './money.yaml#/ID' }
  required: [action]
  description: The set action requires id; clear forbids id. Delivery validates this typed invariant.
ReceiptItemsChange:
  type: object
  additionalProperties: false
  properties:
    action: { type: string, enum: [replace, clear] }
    items:
      type: array
      minItems: 1
      maxItems: 1000
      items: { $ref: './transactions.yaml#/ReceiptItemInput' }
    totalDiscount: { $ref: './money.yaml#/Money' }
  required: [action]
  description: The replace action requires items and totalDiscount; clear forbids both. Delivery validates this typed invariant.
ClassificationProposal:
  type: object
  additionalProperties: false
  properties:
    categoryId: { $ref: './money.yaml#/ID' }
    merchantId: { $ref: './money.yaml#/ID' }
    merchantAlias: { type: string, minLength: 1, maxLength: 200 }
    receiptItems:
      type: array
      maxItems: 1000
      items: { $ref: './transactions.yaml#/ClassificationProposalItem' }
  required: [receiptItems]
Transaction:
  type: object
  additionalProperties: false
  properties:
    participation: { $ref: './matching.yaml#/EffectParticipation' }
    accountingState: { type: string, enum: [included, excluded] }
    decisionId: { $ref: './money.yaml#/ID' }
    protectedFields:
      type: array
      items: { $ref: './transactions.yaml#/FieldProtection' }
    sourceConflict: { type: boolean }
    review: { $ref: './transactions.yaml#/TransactionReview' }
    sourceFacts:
      type: array
      items: { $ref: './transactions.yaml#/SourceTransactionFact' }
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    householdId:
      "$ref": "./money.yaml#/ID"
    actorId:
      "$ref": "./money.yaml#/ID"
    type:
      type: string
      enum:
      - income
      - expense
      - transfer
      - exchange
      - refund
      - opening
      - adjustment
      - yield
      - trade_result
    state:
      type: string
      enum:
      - draft
      - pending
      - posted
      - reversed
      - cancelled
    postedAt:
      "$ref": "./money.yaml#/Instant"
    timezone:
      "$ref": "./money.yaml#/Timezone"
    origin:
      type: string
      enum: [manual, source, legacy]
    feeKnowledge:
      type: string
      enum: [known, unknown]
    pnlBasis:
      type: string
      enum: [gross, net]
    note:
      type: string
      minLength: 1
      maxLength: 2000
    attachmentId:
      "$ref": "./money.yaml#/ID"
    quality:
      "$ref": "./quality.yaml#/DataQuality"
    balanceEffects:
      type: array
      items:
        "$ref": "./transactions.yaml#/TransactionBalanceEffect"
    economicComponents:
      type: array
      items:
        "$ref": "./transactions.yaml#/EconomicComponent"
    holds:
      type: array
      items:
        "$ref": "./transactions.yaml#/TransactionHold"
    exchange:
      "$ref": "./transactions.yaml#/ExecutedExchange"
    occurredAt:
      "$ref": "./money.yaml#/Instant"
    cashDate:
      "$ref": "./money.yaml#/Date"
    expenseMonth:
      "$ref": "./money.yaml#/Month"
    postings:
      type: array
      items:
        "$ref": "./transactions.yaml#/Posting"
    allocation:
      "$ref": "./transactions.yaml#/AllocationSnapshot"
    categoryId:
      "$ref": "./money.yaml#/ID"
    merchantId:
      "$ref": "./money.yaml#/ID"
    receiptItems:
      type: array
      maxItems: 1000
      items: { $ref: './transactions.yaml#/ReceiptItem' }
    merchant:
      type: string
      minLength: 1
      maxLength: 2000
    receiptId:
      "$ref": "./money.yaml#/ID"
    originalTransactionId:
      "$ref": "./money.yaml#/ID"
    sources:
      type: array
      items:
        "$ref": "./accounts.yaml#/SourceReference"
    aiState:
      type: string
      enum:
      - waiting
      - reviewed
      - clarification
      - failed
    payer:
      "$ref": "./transactions.yaml#/Payer"
  required:
  - accountingState
  - protectedFields
  - sourceConflict
  - sourceFacts
  - id
  - revision
  - householdId
  - actorId
  - type
  - state
  - occurredAt
  - cashDate
  - postings
  - allocation
  - sources
  - aiState
  - payer
  - origin
  - feeKnowledge
  - quality
  - balanceEffects
  - economicComponents
  - holds
  - receiptItems
TransactionCreate:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
      - income
      - expense
    funding:
      "$ref": "./transactions.yaml#/PostingFunding"
    accountId:
      "$ref": "./money.yaml#/ID"
    occurredAt:
      "$ref": "./money.yaml#/Instant"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
    categoryId:
      "$ref": "./money.yaml#/ID"
    merchantId:
      "$ref": "./money.yaml#/ID"
    merchant:
      type: string
      minLength: 1
      maxLength: 2000
    allocation:
      "$ref": "./transactions.yaml#/ExpenseAllocation"
    attachmentId:
      "$ref": "./money.yaml#/ID"
    note:
      type: string
      minLength: 1
      maxLength: 2000
    payer:
      "$ref": "./transactions.yaml#/Payer"
  required:
  - type
  - accountId
  - occurredAt
  - amount
  - payer
FeeInput:
  type: object
  additionalProperties: false
  properties:
    funding:
      "$ref": "./transactions.yaml#/PostingFunding"
    accountId:
      "$ref": "./money.yaml#/ID"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
  required:
  - accountId
  - amount
TransferCreate:
  type: object
  additionalProperties: false
  properties:
    fromFunding:
      "$ref": "./transactions.yaml#/PostingFunding"
    toFunding:
      "$ref": "./transactions.yaml#/PostingFunding"
    fromAccountId:
      "$ref": "./money.yaml#/ID"
    toAccountId:
      "$ref": "./money.yaml#/ID"
    occurredAt:
      "$ref": "./money.yaml#/Instant"
    sent:
      "$ref": "./money.yaml#/PositiveMoney"
    received:
      "$ref": "./money.yaml#/PositiveMoney"
    fees:
      maxItems: 998
      type: array
      items:
        "$ref": "./transactions.yaml#/FeeInput"
    existingTransactions:
      maxItems: 100
      type: array
      items:
        "$ref": "./transactions.yaml#/ExistingTransaction"
      uniqueItems: true
  required:
  - fromAccountId
  - toAccountId
  - occurredAt
  - sent
  - received
  - fees
  - existingTransactions
  description: Records internal movement only. Distinct family accounts, equal principal
    for same-asset transfers; explicit native legs for exchange. All referenced IDs
    must be distinct and belong to the trusted household. Before linking, validate
    every expectedRevision atomically with the effect; a stale leg fails with version_conflict
    and changes no leg. An empty list means new movements.
TransactionCorrection:
  type: object
  additionalProperties: false
  properties:
    relatedChanges:
      type: array
      minItems: 1
      maxItems: 99
      items: { $ref: './matching.yaml#/RelatedCorrection' }
    expectedRevision: { $ref: './money.yaml#/Revision' }
    reason: { type: string, minLength: 1, maxLength: 2000 }
    principal:
      type: array
      minItems: 1
      maxItems: 1000
      items: { $ref: './transactions.yaml#/Posting' }
      description: Complete principal group in existing order. Accounts, assets, funding and treatment stay unchanged; signed exact amounts obey the economic type.
    fees:
      type: array
      maxItems: 1000
      items: { $ref: './transactions.yaml#/Posting' }
      description: Complete fee group; an empty list confirms no fee. Only negative movement fees are accepted.
    occurredAt: { $ref: './money.yaml#/Instant' }
    payer: { $ref: './transactions.yaml#/Payer' }
    merchant: { type: string, maxLength: 2000 }
    note: { type: string, maxLength: 2000 }
    category: { $ref: './transactions.yaml#/ClassificationReferenceChange' }
    merchantIdentity: { $ref: './transactions.yaml#/ClassificationReferenceChange' }
    receiptItems: { $ref: './transactions.yaml#/ReceiptItemsChange' }
    allocation: { $ref: './transactions.yaml#/ExpenseAllocation' }
  required: [expectedRevision, reason]
  allOf:
  - anyOf:
    - required: [principal]
    - required: [fees]
    - required: [occurredAt]
    - required: [payer]
    - required: [merchant]
    - required: [note]
    - required: [category]
    - required: [merchantIdentity]
    - required: [receiptItems]
    - required: [allocation]
  description: Omitted fields remain unchanged; explicit actions distinguish clearing classification from no change. Receipt item replacement is atomic. Empty merchant/note clears source text. Amount-based allocations must still match changed item totals; share-based allocations are recalculated exactly.
TransactionLink:
  type: object
  additionalProperties: false
  properties:
    expectedRevisions:
      type: array
      minItems: 2
      maxItems: 100
      items: { $ref: './transactions.yaml#/DecisionRevision' }
    kind: { type: string, enum: [transfer, exchange, receipt_match, refund] }
    reason: { type: string, minLength: 1, maxLength: 2000 }
  required: [expectedRevisions, kind, reason]
  description: The route target is the initial primary. A linked group keeps its primary. All participants and current revisions are required. Refund linking is feature_unavailable. Native amounts are validated without correction.
UndoInput:
  type: object
  additionalProperties: false
  properties:
    decisionId: { $ref: './money.yaml#/ID' }
    reason: { type: string, minLength: 1, maxLength: 2000 }
    expectedRevisions:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: './transactions.yaml#/DecisionRevision' }
  required: [decisionId, reason, expectedRevisions]
ExcludeInput:
  type: object
  additionalProperties: false
  properties:
    relatedRevisions:
      type: array
      minItems: 1
      maxItems: 99
      items: { $ref: './transactions.yaml#/DecisionRevision' }
    expectedRevision: { $ref: './money.yaml#/Revision' }
    reason: { type: string, minLength: 1, maxLength: 2000 }
  required: [expectedRevision, reason]
DecisionRevision:
  type: object
  additionalProperties: false
  properties:
    transactionId: { $ref: './money.yaml#/ID' }
    expectedRevision: { $ref: './money.yaml#/Revision' }
  required: [transactionId, expectedRevision]
LedgerField:
  type: string
  enum: [principal, fees, occurred_at, payer, merchant, note, accounting, category, merchant_identity, receipt_items, allocation, legacy_all, matching, contribution]
FieldProtection:
  type: object
  additionalProperties: false
  properties:
    field: { $ref: './transactions.yaml#/LedgerField' }
    decisionId: { $ref: './money.yaml#/ID' }
    revision: { $ref: './money.yaml#/Revision' }
  required: [field, revision]
TransactionHistoryEntry:
  type: object
  additionalProperties: false
  properties:
    transaction: { $ref: './transactions.yaml#/Transaction' }
    before: { $ref: './transactions.yaml#/Transaction' }
    decisionId: { $ref: './money.yaml#/ID' }
    decisionKind: { type: string, enum: [correction, exclusion, undo, automated, matching] }
    undoOf: { $ref: './money.yaml#/ID' }
    evidence:
      type: array
      items: { $ref: './transactions.yaml#/DecisionEvidence' }
    recordedAt: { $ref: './money.yaml#/Instant' }
    reason: { type: string, minLength: 1, maxLength: 2000 }
    fields:
      type: array
      items: { $ref: './transactions.yaml#/LedgerField' }
    affected:
      type: array
      items: { $ref: './transactions.yaml#/DecisionRevision' }
    undoAvailable: { type: boolean }
    undoReason: { type: string, enum: [available, legacy, superseded, already_undone, source_ambiguous, invalid_restore] }
  required: [transaction, reason, fields, affected, evidence, undoAvailable, undoReason]
DecisionEvidence:
  type: object
  additionalProperties: false
  properties:
    kind: { type: string, enum: [source, attachment, review] }
    id: { $ref: './money.yaml#/ID' }
    revision: { $ref: './money.yaml#/Revision' }
  required: [kind, id, revision]
TransactionReview:
  type: object
  additionalProperties: false
  properties:
    revision: { $ref: './money.yaml#/Revision' }
    actorId: { $ref: './money.yaml#/ID' }
    state: { type: string, enum: [reviewed, clarification, failed] }
    rationale: { type: string, minLength: 1, maxLength: 2000 }
    recordedAt: { $ref: './money.yaml#/Instant' }
    evidence:
      type: array
      items: { $ref: './transactions.yaml#/DecisionEvidence' }
    classificationProposal: { $ref: './transactions.yaml#/ClassificationProposal' }
  required: [revision, actorId, state, rationale, recordedAt, evidence]
SourceTransactionFact:
  type: object
  additionalProperties: false
  description: Latest normalized value of each source known to this financial revision; retained even when protected fields disagree. This is evidence, never an additional accounting effect.
  properties:
    sourceId: { $ref: './money.yaml#/ID' }
    sourceRevision: { $ref: './money.yaml#/Revision' }
    conflictAtImport: { type: string, enum: [none, protected_fields, invalid_merge, legacy_protection, matching_conflict] }
    type: { type: string, enum: [income, expense, transfer, exchange, refund, opening, adjustment, yield, trade_result] }
    state: { type: string, enum: [draft, pending, posted, reversed, cancelled] }
    occurredAt: { $ref: './money.yaml#/Instant' }
    postedAt: { $ref: './money.yaml#/Instant' }
    feeKnowledge: { type: string, enum: [known, unknown] }
    merchant: { type: string, maxLength: 2000 }
    note: { type: string, maxLength: 2000 }
    payer: { $ref: './transactions.yaml#/Payer' }
    postings:
      type: array
      items: { $ref: './transactions.yaml#/Posting' }
  required: [sourceId, sourceRevision, conflictAtImport, type, state, occurredAt, feeKnowledge, merchant, note, payer, postings]
TransactionHistoryPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items: { $ref: './transactions.yaml#/TransactionHistoryEntry' }
    nextCursor: { type: string }
  required: [items]
AllocationChange:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    allocation:
      "$ref": "./transactions.yaml#/ExpenseAllocation"
    items:
      type: array
      maxItems: 1000
      items:
        "$ref": "./transactions.yaml#/AllocationItemOverride"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - expectedRevision
  - allocation
  - reason
AllocationItemOverride:
  type: object
  additionalProperties: false
  properties:
    itemId: { $ref: './money.yaml#/ID' }
    allocation: { $ref: './transactions.yaml#/ExpenseAllocation' }
  required: [itemId, allocation]
RefundCreate:
  type: object
  additionalProperties: false
  properties:
    purchaseId:
      "$ref": "./money.yaml#/ID"
    purchaseExpectedRevision:
      "$ref": "./money.yaml#/Revision"
    accountId:
      "$ref": "./money.yaml#/ID"
    occurredAt:
      "$ref": "./money.yaml#/Instant"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
    itemIds:
      type: array
      items:
        "$ref": "./money.yaml#/ID"
  required:
  - purchaseId
  - purchaseExpectedRevision
  - accountId
  - occurredAt
  - amount
  - itemIds
  description: Refund is bounded by unrefunded purchase value. Original month, audited
    allocation and historical valuation are used.
TransactionPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./transactions.yaml#/Transaction"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
ExistingTransaction:
  type: object
  additionalProperties: false
  properties:
    transactionId:
      "$ref": "./money.yaml#/ID"
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
  required:
  - transactionId
  - expectedRevision
KnownPayer:
  type: object
  additionalProperties: false
  properties:
    state:
      type: string
      enum:
      - known
    memberId:
      "$ref": "./money.yaml#/ID"
  required:
  - state
  - memberId
  description: Membership must be active in the trusted household. Payer never assigns
    the authenticated actor or expense allocation.
UnspecifiedPayer:
  type: object
  additionalProperties: false
  properties:
    state:
      type: string
      enum:
      - unknown
      - not_applicable
  required:
  - state
  description: Unknown requires clarification for a household-paid expense. Not applicable
    is for external income or non-payment records; the application validates economic
    type.
Payer:
  oneOf:
  - "$ref": "./transactions.yaml#/KnownPayer"
  - "$ref": "./transactions.yaml#/UnspecifiedPayer"

PostingFunding:
  type: string
  enum: [own, credit, unknown]
  description: Explicit source/user funding; omitted input uses own for non-credit products and unknown for credit cards. Credit is never spendable own money.
PostingTreatment:
  type: string
  enum: [movement, included, valuation]
  description: Included fee is already part of net PnL; valuation is not received money.
TransactionBalanceEffect:
  type: object
  additionalProperties: false
  properties:
    accountId:
      "$ref": "./money.yaml#/ID"
    at:
      "$ref": "./money.yaml#/Instant"
    owned:
      "$ref": "./quality.yaml#/AmountValue"
    available:
      "$ref": "./quality.yaml#/AmountValue"
    locked:
      "$ref": "./quality.yaml#/AmountValue"
    debt:
      "$ref": "./quality.yaml#/AmountValue"
  required: [accountId, at, owned, available, locked, debt]
EconomicComponent:
  type: object
  additionalProperties: false
  properties:
    kind:
      type: string
      enum: [income, expense, fee, interest, funding, reward, realized_pnl, unrealized_pnl]
    money:
      "$ref": "./money.yaml#/Money"
    treatment:
      "$ref": "./transactions.yaml#/PostingTreatment"
  required: [kind, money, treatment]
TransactionHold:
  type: object
  additionalProperties: false
  properties:
    accountId:
      "$ref": "./money.yaml#/ID"
    amount:
      "$ref": "./money.yaml#/PositiveMoney"
    funding:
      "$ref": "./transactions.yaml#/PostingFunding"
  required: [accountId, amount, funding]
ExecutedExchange:
  type: object
  additionalProperties: false
  description: Exact executed ratio is sent divided by received; retain both native amounts without persisting a rounded rate or including fees in principal.
  properties:
    sent:
      "$ref": "./money.yaml#/PositiveMoney"
    received:
      "$ref": "./money.yaml#/PositiveMoney"
  required: [sent, received]
