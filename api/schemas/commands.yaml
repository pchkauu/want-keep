---
CommandPending:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/CommandID"
    type:
      type: string
      minLength: 1
      maxLength: 2000
    status:
      type: string
      enum:
      - pending
    registeredAt:
      "$ref": "./money.yaml#/Instant"
  required:
  - id
  - type
  - status
  - registeredAt
CommandSucceeded:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/CommandID"
    type:
      type: string
      minLength: 1
      maxLength: 2000
    status:
      type: string
      enum:
      - succeeded
    registeredAt:
      "$ref": "./money.yaml#/Instant"
    completedAt:
      "$ref": "./money.yaml#/Instant"
    result:
      "$ref": "./commands.yaml#/CommandResult"
  required:
  - id
  - type
  - status
  - registeredAt
  - completedAt
  - result
CommandFailed:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/CommandID"
    type:
      type: string
      minLength: 1
      maxLength: 2000
    status:
      type: string
      enum:
      - failed
    registeredAt:
      "$ref": "./money.yaml#/Instant"
    completedAt:
      "$ref": "./money.yaml#/Instant"
    error:
      "$ref": "./quality.yaml#/APIError"
  required:
  - id
  - type
  - status
  - registeredAt
  - completedAt
  - error
CommandStatus:
  oneOf:
  - "$ref": "./commands.yaml#/CommandPending"
  - "$ref": "./commands.yaml#/CommandSucceeded"
  - "$ref": "./commands.yaml#/CommandFailed"
  description: D-41 retains terminal detail for 90 days after outcome or reconciliation; unresolved commands remain available until reconciliation. A compact tombstone survives unresolved state and 400 days after resolution. Visible only to the
    originating authorized member; current result-resource authorization is checked
    independently. Unknown is client knowledge, never a terminal server status.
EmptyInput:
  type: object
  additionalProperties: false
  properties: {}
  required: []
CommandStatusPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./commands.yaml#/CommandStatus"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
CommandResult:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      minLength: 1
      maxLength: 2000
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
  required:
  - type
  - id
  - revision

SucceededOutcome:
  type: object
  additionalProperties: false
  properties:
    commandId:
      $ref: ./money.yaml#/CommandID
    status:
      type: string
      enum:
        - succeeded
    result:
      $ref: ./commands.yaml#/CommandResult
  required:
    - commandId
    - status
    - result
FailedOutcome:
  type: object
  additionalProperties: false
  properties:
    commandId:
      $ref: ./money.yaml#/CommandID
    status:
      type: string
      enum:
        - failed
    failureCode:
      $ref: ./quality.yaml#/ErrorCode
  required:
    - commandId
    - status
    - failureCode
CommandOutcome:
  oneOf:
    - $ref: ./commands.yaml#/SucceededOutcome
    - $ref: ./commands.yaml#/FailedOutcome
ExpiredCommand:
  type: object
  additionalProperties: false
  properties:
    version:
      type: string
      enum:
        - '1'
    code:
      type: string
      enum:
        - command_expired
    message:
      type: string
      minLength: 1
      maxLength: 2000
    violations:
      type: array
      items:
        $ref: ./quality.yaml#/FieldViolation
    retryable:
      type: boolean
    correlationId:
      $ref: ./money.yaml#/ID
    currentRevision:
      $ref: ./money.yaml#/Revision
    outcome:
      $ref: ./commands.yaml#/CommandOutcome
  required:
    - version
    - code
    - message
    - violations
    - retryable
    - correlationId
  description: >-
    HTTP 410 safe error. The optional compact outcome is included only after result-resource
    authorization. It cannot authorize a second execution.
