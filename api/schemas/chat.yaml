---
Attachment:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    accountId:
      "$ref": "./money.yaml#/ID"
    actorId:
      "$ref": "./money.yaml#/ID"
    reason:
      type: string
      enum: ['', storage_unavailable, processor_unavailable, invalid_document, unsupported_content, limit_exceeded]
    pageCount:
      type: integer
      minimum: 1
      maximum: 10
      description: Present only after successful validation; unknown is absent, never zero.
    previewReady:
      type: boolean
      description: True only when every safe PNG page has been generated and accepted; storage availability is reported separately.
    previewPages:
      type: array
      maxItems: 10
      items:
        "$ref": "./chat.yaml#/AttachmentPreviewPage"
    name:
      type: string
      minLength: 1
      maxLength: 2000
    mediaType:
      type: string
      enum:
      - image/jpeg
      - image/png
      - image/webp
      - application/pdf
    sizeBytes:
      type: integer
      minimum: 1
      maximum: 10485760
    state:
      type: string
      enum:
      - uploaded
      - validating
      - accepted
      - rejected
  required:
  - id
  - accountId
  - actorId
  - reason
  - previewPages
  - previewReady
  - name
  - mediaType
  - sizeBytes
  - state
AttachmentUpload:
  type: object
  additionalProperties: false
  properties:
    uploadId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    file:
      type: string
      format: binary
    accountId:
      "$ref": "./money.yaml#/ID"
  required:
  - uploadId
  - file
  - accountId
  description: Client creates uploadId before sending; it is the attachment ID for result lookup.
    The same household/actor/uploadId with identical name, account, MIME and bytes replays;
    altered input conflicts. Uploads are separate from financial command retention.
    Maximum 10 MiB, 10 PDF pages and 40 megapixels for images. The selected family account is required.
AttachmentPreviewPage:
  type: object
  additionalProperties: false
  properties:
    page:
      type: integer
      minimum: 1
      maximum: 10
    width:
      type: integer
      minimum: 1
      maximum: 2048
    height:
      type: integer
      minimum: 1
      maximum: 2048
  required: [page, width, height]
PrivacyStatus:
  type: object
  additionalProperties: false
  properties:
    attachments:
      type: string
      enum: [available, unavailable]
    connections:
      type: string
      enum: [available, unavailable]
    processor:
      type: string
      enum: [available, unavailable]
  required: [attachments, connections, processor]
  description: Authenticated capabilities only; no keys, paths, credential IDs or diagnostic payloads.
Receipt:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    attachmentId:
      "$ref": "./money.yaml#/ID"
    accountId:
      "$ref": "./money.yaml#/ID"
    state:
      type: string
      enum:
      - uploaded
      - validating
      - processing
      - clarification
      - skipped
      - linked
      - recorded
      - failed
      - waiting_ai
    items:
      type: array
      items:
        "$ref": "./transactions.yaml#/ReceiptItem"
    total:
      "$ref": "./quality.yaml#/AmountValue"
    transactionId:
      "$ref": "./money.yaml#/ID"
    reason:
      type: string
      minLength: 1
      maxLength: 2000
  required:
  - id
  - revision
  - attachmentId
  - accountId
  - state
  - items
  - total
Message:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    threadId:
      "$ref": "./money.yaml#/ID"
    actorId:
      "$ref": "./money.yaml#/ID"
    createdAt:
      "$ref": "./money.yaml#/Instant"
    text:
      type: string
      maxLength: 20000
    attachments:
      type: array
      items:
        "$ref": "./chat.yaml#/Attachment"
    commandId:
      "$ref": "./money.yaml#/CommandID"
  required:
  - id
  - threadId
  - actorId
  - createdAt
  - text
  - attachments
MessageCreate:
  type: object
  additionalProperties: false
  properties:
    text:
      type: string
      maxLength: 20000
    attachmentIds:
      type: array
      items:
        "$ref": "./money.yaml#/ID"
      maxItems: 10
    accountId:
      "$ref": "./money.yaml#/ID"
  required:
  - text
  - attachmentIds
  description: At least text or an attachment is required. Attachments require accountId;
    unknown receipt facts create clarification.
  allOf:
  - anyOf:
    - properties:
        attachmentIds:
          maxItems: 0
    - required:
      - accountId
  - anyOf:
    - properties:
        text:
          minLength: 1
    - properties:
        attachmentIds:
          minItems: 1
      required:
      - accountId
Thread:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    householdId:
      "$ref": "./money.yaml#/ID"
  required:
  - id
  - householdId
  description: One shared thread per family; message authors remain distinct.
Clarification:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    question:
      type: string
      minLength: 1
      maxLength: 2000
    subject:
      "$ref": "./reports.yaml#/ResourceReference"
    state:
      type: string
      enum:
      - pending
      - answered
      - superseded
  required:
  - id
  - revision
  - question
  - subject
  - state
ClarificationAnswer:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    answer:
      type: string
      minLength: 1
      maxLength: 2000
    subjectExpectedRevision:
      "$ref": "./money.yaml#/Revision"
  required:
  - expectedRevision
  - answer
  - subjectExpectedRevision
Proposal:
  type: object
  additionalProperties: false
  properties:
    id:
      "$ref": "./money.yaml#/ID"
    revision:
      "$ref": "./money.yaml#/Revision"
    subject:
      "$ref": "./reports.yaml#/ResourceReference"
    summary:
      type: string
      minLength: 1
      maxLength: 2000
    evidence:
      type: array
      items:
        "$ref": "./reports.yaml#/ResourceReference"
    state:
      type: string
      enum:
      - pending
      - applied
      - rejected
      - superseded
  required:
  - id
  - revision
  - subject
  - summary
  - evidence
  - state
ProposalDecision:
  type: object
  additionalProperties: false
  properties:
    expectedRevision:
      "$ref": "./money.yaml#/Revision"
    subjectExpectedRevision:
      "$ref": "./money.yaml#/Revision"
    decision:
      type: string
      enum:
      - apply
      - reject
  required:
  - expectedRevision
  - subjectExpectedRevision
  - decision
MessagePage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./chat.yaml#/Message"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
ClarificationPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        "$ref": "./chat.yaml#/Clarification"
    nextCursor:
      type: string
      minLength: 1
      maxLength: 2048
    quality:
      "$ref": "./quality.yaml#/DataQuality"
  required:
  - items
  - quality
