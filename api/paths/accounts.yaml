---
"/accounts":
  get:
    operationId: accounts_list
    tags:
    - accounts
    summary: accounts list
    parameters:
    - "$ref": "../components.yaml#/parameters/Cursor"
    - "$ref": "../components.yaml#/parameters/Limit"
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/accounts.yaml#/AccountPage"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
  post:
    operationId: accounts_create
    tags:
    - accounts
    summary: accounts create
    parameters:
    - "$ref": "../components.yaml#/parameters/IdempotencyKey"
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '202':
        description: Registered command. Inspect its stable ID after timeout; do not
          create a new key. Financial effect and successful result commit atomically.
        content:
          application/json:
            schema:
              "$ref": "../schemas/commands.yaml#/CommandStatus"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    x-command-type: accounts.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/accounts.yaml#/AccountCreate"
