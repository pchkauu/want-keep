"/connections/raiffeisen/callback":
  get:
    operationId: connections_raiffeisen_callback
    tags:
    - connections
    summary: connections raiffeisen callback
    parameters:
    - name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    - name: code
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    - name: error
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    responses:
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
      '303':
        description: Return to the bound connection; no code/state in redirect URL.
        headers:
          Location:
            schema:
              type: string
            description: Same-origin connection screen, never a request-provided URL.
    description: Registered external route. Requires the same authenticated external-owner
      session, bound state/nonce/PKCE and exactly one of code or error. Single consumption;
      no automatic retry of ambiguous token exchange. Handler belongs to task-4.2;
      currently unavailable.
