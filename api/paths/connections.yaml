"/connections/{connectionId}/sync":
  post:
    operationId: connections_sync
    description: Requires current authorized connection and exact admitted deployment binding before job or collector IO. Admission check and enqueue are atomic; jobs/results carry immutable binding and admissionRevision, rechecked before IO and in the source/posting/outbox transaction. A stale gate returns provider_not_admitted (409); results invalidated after IO starts remain in quarantine without source records or postings. Cancellation is best effort.
    tags:
    - connections
    summary: connections sync
    parameters:
    - name: connectionId
      in: path
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - "$ref": "../components.yaml#/parameters/IdempotencyKey"
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '202':
        description: Registered command. Inspect its stable ID after timeout; do not
          create a new key. Financial effect and successful result commit atomically.
        content:
          application/json:
            schema:
              "$ref": "../schemas/commands.yaml#/CommandStatus"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
      '410':
        description: Expired command detail; authorized compact outcome may be recovered without execution.
        content:
          application/json:
            schema:
