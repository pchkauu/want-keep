---
"/transactions":
  get:
    operationId: transactions_list
    tags:
    - transactions
    summary: List current ledger revisions
    description: Keyset order occurredAt descending, then ID descending. Cursor is session/household/filter-bound; each page is a consistent read, not a complete household financial report.
    parameters:
    - "$ref": "../components.yaml#/parameters/Cursor"
    - "$ref": "../components.yaml#/parameters/Limit"
    - name: accountId
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: from
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: to
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: categoryId
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: type
      in: query
      schema:
        type: string
        enum: [income, expense, transfer, exchange, refund, opening, adjustment, yield, trade_result]
    - name: state
      in: query
      schema:
        type: string
        enum: [draft, pending, posted, cancelled, reversed]
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/transactions.yaml#/TransactionPage"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
  post:
    operationId: transactions_create
    tags:
    - transactions
    summary: Record a confirmed manual income or expense
    description: Household fact is posted even when allocation is unresolved. Category and resolved allocation requests return feature_unavailable until their owning tasks ship; fields are never ignored. Cash date follows the purchase in household timezone. Inputs cannot set actor, household, state or AI status.
    parameters:
    - "$ref": "../components.yaml#/parameters/IdempotencyKey"
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '202':
        description: Registered command. Inspect its stable ID after timeout; do not
          create a new key. Financial effect and successful result commit atomically.
        content:
          application/json:
            schema:
              "$ref": "../schemas/commands.yaml#/CommandStatus"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
      '410':
        description: Expired command detail; authorized compact outcome may be recovered without execution.
        content:
          application/json:
            schema:
              "$ref": "../schemas/commands.yaml#/ExpiredCommand"
    x-command-type: transactions.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/transactions.yaml#/TransactionCreate"
