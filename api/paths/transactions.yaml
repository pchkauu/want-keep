---
"/transactions":
  get:
    operationId: transactions_list
    tags:
    - transactions
    summary: transactions list
    parameters:
    - "$ref": "../components.yaml#/parameters/Cursor"
    - "$ref": "../components.yaml#/parameters/Limit"
    - name: accountId
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: from
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: to
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: categoryId
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/transactions.yaml#/TransactionPage"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
  post:
    operationId: transactions_create
    tags:
    - transactions
    summary: transactions create
    parameters:
    - "$ref": "../components.yaml#/parameters/IdempotencyKey"
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '202':
        description: Registered command. Inspect its stable ID after timeout; do not
          create a new key. Financial effect and successful result commit atomically.
        content:
          application/json:
            schema:
              "$ref": "../schemas/commands.yaml#/CommandStatus"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    x-command-type: transactions.create
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/transactions.yaml#/TransactionCreate"
