"/auth/session/activity":
  post:
    operationId: auth_session_activity
    tags: [auth]
    summary: Record explicit foreground activity without extending absolute session expiry
    description: Requires a currently active session. Background polling must not call this endpoint. Does not create a financial command.
    parameters:
      - $ref: '../components.yaml#/parameters/CSRF'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/commands.yaml#/EmptyInput'
    responses:
      '204':
        description: Activity recorded
      '400':
        $ref: '../components.yaml#/responses/Problem'
      '401':
        $ref: '../components.yaml#/responses/Problem'
      '403':
        $ref: '../components.yaml#/responses/Problem'
      '429':
        $ref: '../components.yaml#/responses/Problem'
      '503':
        $ref: '../components.yaml#/responses/Problem'
