"/auth/login/options":
  post:
    operationId: auth_login_options
    tags:
    - auth
    summary: auth login options
    parameters: []
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/auth.yaml#/LoginOptions"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    security: []
    description: 'Ceremony-bound operation: one-use challenge/attempt, verified Origin
      and authorization purpose; does not use financial-command retention.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/commands.yaml#/EmptyInput"
