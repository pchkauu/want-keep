"/household/invitations/{id}/revoke":
  post:
    operationId: household_revoke_invitation
    tags:
    - household
    summary: Revoke current invitation
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: ../schemas/money.yaml#/ID
    - "$ref": "../components.yaml#/parameters/CSRF"
    responses:
      '200':
        description: Success; private no-store response. Session/enrollment secrets are never replayed.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Set-Cookie:
            description: Session or ceremony cookie where applicable; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain.
            schema:
              type: string
        content:
          application/json:
            schema:
              "$ref": "../schemas/household.yaml#/InvitationState"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    description: 'Revoke with active membership, CSRF and expectedRevision. Invalidates pending enrollment. No fresh authentication required.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/household.yaml#/InvitationMutationInput"

