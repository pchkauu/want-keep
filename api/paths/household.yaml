---
"/household/bootstrap":
  post:
    operationId: household_bootstrap
    tags:
    - household
    summary: household bootstrap
    parameters: []
    responses:
      '200':
        description: Success; private no-store response. Session/enrollment secrets are never replayed.
        headers:
          Cache-Control:
            schema:
              type: string
              enum: [no-store]
          Set-Cookie:
            description: Session or ceremony cookie where applicable; Secure, HttpOnly, SameSite=Lax, Path=/, no Domain.
            schema:
              type: string
        content:
          application/json:
            schema:
              "$ref": "../schemas/auth.yaml#/EnrollmentOptions"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
    security: []
    description: 'Ceremony-bound operation: one-use challenge/attempt, verified Origin
      and authorization purpose; does not use financial-command retention.'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "../schemas/household.yaml#/SetupInput"
