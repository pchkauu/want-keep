---
"/reports/dashboard":
  get:
    operationId: reports_dashboard
    tags:
    - reports
    summary: reports dashboard
    parameters:
    - name: view
      in: query
      required: false
      schema:
        type: string
        enum:
        - household
        - member
    - name: memberId
      in: query
      required: false
      schema:
        "$ref": "../schemas/money.yaml#/ID"
    - name: asset
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Asset"
    - name: from
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    - name: to
      in: query
      required: true
      schema:
        "$ref": "../schemas/money.yaml#/Date"
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              "$ref": "../schemas/reports.yaml#/Dashboard"
      '400':
        "$ref": "../components.yaml#/responses/Problem"
      '401':
        "$ref": "../components.yaml#/responses/Problem"
      '403':
        "$ref": "../components.yaml#/responses/Problem"
      '404':
        "$ref": "../components.yaml#/responses/Problem"
      '409':
        "$ref": "../components.yaml#/responses/Problem"
      '422':
        "$ref": "../components.yaml#/responses/Problem"
      '429':
        "$ref": "../components.yaml#/responses/Problem"
      '500':
        "$ref": "../components.yaml#/responses/Problem"
      '503':
        "$ref": "../components.yaml#/responses/Problem"
