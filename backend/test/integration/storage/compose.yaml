# Disposable synthetic data only; never use production credentials here.
name: want-keep-storage-test
services:
  postgres:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: want_keep_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-admin
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d want_keep_test"]
      interval: 5s
      timeout: 5s
      retries: 10
